# 啟用滑鼠支援
set -g mouse on
set -g default-terminal "tmux-256color"

# 剪貼
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# 狀態列底色（深藍灰）與一般文字（淺灰）
set -g status-style bg='#181825',fg='#cdd6f4'

# 左側 Session 標籤（薰衣草紫底黑字）
set -g status-left '#[bg=#b4befe,fg=#11111b,bold] #S #[bg=default,fg=default] '

# 當前視窗（柔和粉綠高亮）
set -g window-status-current-style bg='#a6e3a1',fg='#11111b',bold
set -g window-status-current-format ' #I:#W '

# 右側時間日期（深灰底、天藍字）
set -g status-right '#[fg=#89dceb]%H:%M #[fg=#6c7086]%d-%b'
